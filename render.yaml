services:
  # Next.js Frontend
  - type: web
    name: biosite-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node scripts/start-with-monitoring.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY
        sync: false
